services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      BROWSER_HEADLESS: "true"
    ports:
      - "8000:8000"
    shm_size: "1gb"  # Chromium needs more than Docker's 64MB default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
