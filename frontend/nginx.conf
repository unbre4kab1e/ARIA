# Rendered by the nginx image's envsubst step: ${PORT} and ${BACKEND_URL}
# come from the container environment (see Dockerfile / docker-compose / Cloud Run).
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Screenshots are posted as base64 JSON
    client_max_body_size 10m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to backend
    location /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host $proxy_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket to backend
    location /ws/ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $proxy_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
